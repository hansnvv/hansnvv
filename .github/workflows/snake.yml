name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&animate=true
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&animate=true
            
      - name: Apply adaptive colors
        run: |
          python3 - << 'EOF'
          import re, os

          light_style = ':root{--cb:#1b1f230a;--cs:#58a6ff;--ce:#ebedf0;--c0:#ebedf0;--c1:#9be9a8;--c2:#40c463;--c3:#30a14e;--c4:#216e39}'
          dark_style  = ':root{--cb:#ffffff0a;--cs:#58a6ff;--ce:#161b22;--c0:#161b22;--c1:#0e4429;--c2:#006d32;--c3:#26a641;--c4:#39d353}'

          files = {
              'dist/github-contribution-grid-snake.svg': light_style,
              'dist/github-contribution-grid-snake-dark.svg': dark_style,
          }

          os.makedirs('output', exist_ok=True)
          for path, style in files.items():
              with open(path, 'r') as f:
                  content = f.read()
              content = re.sub(r':root\{[^}]+\}', style, content, count=1)
              out = path.replace('dist/', 'output/')
              with open(out, 'w') as f:
                  f.write(content)

          print("Done!")
          EOF

      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
